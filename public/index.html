<!DOCTYPE html>
<!-- Highway 1's web page: Godot 4.6.3's own (platform/web/misc/godot.html), plus what
     phones need (marked "Highway 1 on phones"). $GODOT_... are filled in by the export. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Highway 1</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">

		<style>
/* Highway 1 on phones: no zooming, scrolling or text selection; sideways only. */
html, body {
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#hw-turn, #hw-name {
	position: fixed;
	inset: 0;
	display: none;
	align-items: center;
	justify-content: center;
	text-align: center;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	color: #fff;
}

#hw-turn {
	z-index: 30;
	background: #0d0f12;
	font-size: 22px;
	font-weight: 600;
	line-height: 1.5;
	padding: 2em;
}

#hw-turn b {
	color: #ffd94d;
	font-size: 64px;
	display: block;
}

@media (orientation: portrait) and (hover: none) and (pointer: coarse) {
	#hw-turn { display: flex; }
}

#hw-name {
	z-index: 20;
	background: rgba(0, 0, 0, 0.55);
}

#hw-name form {
	background: #14171c;
	border-radius: 12px;
	padding: 20px 24px;
	box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
	max-width: 90vw;
}

#hw-name label {
	display: block;
	color: #ffd94d;
	font-size: 20px;
	font-weight: 600;
	margin-bottom: 12px;
}

#hw-name input {
	font-size: 20px; /* 16px or more: iOS doesn't zoom in on it */
	padding: 10px 12px;
	width: 16em;
	max-width: 70vw;
	border-radius: 8px;
	border: 1px solid #555;
	background: #0b0c0f;
	color: #fff;
	user-select: text;
	-webkit-user-select: text;
}

#hw-name button {
	font-size: 18px;
	font-weight: 600;
	margin: 14px 8px 0;
	padding: 10px 22px;
	border-radius: 8px;
	border: 0;
	background: #ffd94d;
	color: #111;
}

#hw-name button.skip {
	background: #3a3f47;
	color: #fff;
}

#hw-tip {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 3%;
	display: none;
	text-align: center;
	font-family: system-ui, -apple-system, sans-serif;
	font-size: 15px;
	color: #cfd3d8;
	padding: 0 1em;
}

		<script>
// Highway 1 on phones and tablets.
(function () {
	const coarse = window.matchMedia('(pointer: coarse)').matches;
	const standalone = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
		|| window.navigator.standalone === true;
	// No pinch-zooming the page (iOS ignores user-scalable=no).
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());
	// Android: the first tap goes full screen and turns it sideways (iPhones can't; adding
	// it to the home screen does the same there). Only once: if they leave, they meant it.
	let asked = false;
	function fullScreen() {
		if (asked || !coarse || standalone || document.fullscreenElement || !document.fullscreenEnabled) {
			return;
		}
		asked = true;
		document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(() => {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(() => {});
			}
		}).catch(() => {});
	}
	document.addEventListener('touchend', fullScreen, { passive: true });

	// iPhones and iPads: Safari can't go full screen, but from the home screen it opens
	// like an app. Said while it loads (it goes with the loading screen).
	const ios = /iPhone|iPad|iPod/.test(navigator.userAgent)
		|| (navigator.userAgent.includes('Macintosh') && navigator.maxTouchPoints > 1);
	document.addEventListener('DOMContentLoaded', () => {
		if (ios && !standalone) {
			document.getElementById('hw-tip').style.display = 'block';
		}
	});

	// The leaderboard name on a touch screen: a real text box, so the phone's own keyboard
	// comes up. The game calls highwayAskName(current, done) and gets the name (or '').
	window.highwayAskName = function (current, done) {
		const box = document.getElementById('hw-name');
		const input = box.querySelector('input');
		const form = box.querySelector('form');
		input.value = current || '';
		box.style.display = 'flex';
		function finish(name) {
			box.style.display = 'none';
			form.onsubmit = null;
			box.querySelector('.skip').onclick = null;
			input.blur();
			done(name);
		}
		form.onsubmit = (e) => {
			e.preventDefault();
			finish(input.value.trim());
		};
		box.querySelector('.skip').onclick = () => finish('');
		input.focus();
	};
}());
		</script>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="hw-turn"><div><b>&#x21bb;</b>Turn your phone sideways to drive.</div></div>

		<div id="hw-name">
			<form>
				<label for="hw-name-input">Your name for the leaderboard</label>
				<input id="hw-name-input" type="text" maxlength="16" autocomplete="nickname" autocapitalize="words"
					autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="up to 16 letters">
				<div>
					<button type="button" class="skip">Skip</button>
					<button type="submit">OK</button>
				</div>
			</form>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
			<div id="hw-tip">For full screen on an iPhone or iPad: Share, then Add to Home Screen, and play it from there.</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21971304,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
