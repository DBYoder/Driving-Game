name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.6.3

jobs:
  tools:
    name: Data pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tools/tests -q

  game:
    name: Test and export game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe \
            templates/linux_release.x86_64 -d templates
          rm templates.tpz

      - name: Install Godot
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      # Every Godot call gets a hard timeout: a script that fails to compile can leave
      # the engine running instead of exiting.
      - name: Import project
        run: timeout 300 godot --headless --path game --import

      - name: Unit tests
        run: timeout 300 godot --headless --path game -s res://tests/run_tests.gd

      - name: Export Windows and Linux builds
        run: |
          mkdir -p build/windows build/linux
          timeout 300 godot --headless --path game --export-release "Windows Desktop" ../build/windows/HighwayOne.exe
          timeout 300 godot --headless --path game --export-release "Linux" ../build/linux/HighwayOne.x86_64
          test -s build/windows/HighwayOne.exe

      - name: Smoke-test the exported build
        run: timeout 120 ./build/linux/HighwayOne.x86_64 --headless -- --smoke-test

      # Both drives also fail if anything pops in where the haze doesn't hide it, or the
      # car visibly clips into wrecks, debris, corn or the ground.
      - name: QA drive (autopilot drives all 15 miles)
        run: timeout 600 ./build/linux/HighwayOne.x86_64 --headless --fixed-fps 60 -- --qa-drive

      - name: QA drive at 110 mph (streaming keeps up)
        run: timeout 600 ./build/linux/HighwayOne.x86_64 --headless --fixed-fps 60 -- --qa-drive --autopilot-mph=110

      - name: QA drift (a handbrake turn slides at least 35 degrees and recovers)
        run: timeout 120 ./build/linux/HighwayOne.x86_64 --headless --fixed-fps 60 -- --qa-drift

      - name: QA stress (fast driving with random handbrake, full lock and panic stops)
        run: |
          for seed in 1 2 3; do
            timeout 300 ./build/linux/HighwayOne.x86_64 --headless --fixed-fps 60 -- --qa-stress --seed=$seed
          done

      - name: Screenshots (software rendering)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
          mkdir -p build/screenshots
          shoot() {
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" ./build/linux/HighwayOne.x86_64 \
              --rendering-driver opengl3 --resolution 1280x720 -- \
              --screenshot="$PWD/build/screenshots/$1.png" --station=$2 --view=$3 $4
          }
          shoot kalona-start-chase 175 0
          shoot mile-1-traffic 2400 0 --traffic-near
          shoot mile-4-props 6150 2
          shoot mile-5-corn 8000 2
          shoot mile-7-drone 11500 3
          shoot mile-9-long-view 14600 2 --no-traffic

      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: build/screenshots

      - name: Package for friends
        run: |
          cp docs/PLAYING.txt build/windows/README.txt
          cp docs/GODOT_LICENSE.txt build/windows/LICENSE-Godot.txt
          cd build/windows && zip -q -9 -r ../HighwayOne-windows.zip .

      - uses: actions/upload-artifact@v6
        with:
          name: HighwayOne-windows
          path: build/HighwayOne-windows.zip

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tools, game]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: HighwayOne-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **HighwayOne-windows.zip**, unzip it, and run `HighwayOne.exe`.
            Windows will warn that it's from an unknown publisher: click **More info → Run anyway**.
            Full instructions are in the README.txt inside the zip.
          files: HighwayOne-windows.zip
